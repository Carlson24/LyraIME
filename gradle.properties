# https://developer.android.com/build/optimize-your-build#disable-the-jetifier-flag
android.enableJetifier=false
android.useAndroidX=true

# enlarge heap size to 4GB
org.gradle.jvmargs=-Xmx4096M -XX:+HeapDumpOnOutOfMemoryError

# Only package arm64-v8a (Android ABI: arm64-v8a)
buildABI=arm64-v8a

# Qualcomm QNN SDK path:
#   - In terminal: export QNN_SDK_ROOT=$HOME/.local/share/Android/qairt/version
#   - In Android Studio: uncomment and edit below
qnnSdkRoot=/home/carlson/.local/share/Android/qairt/2.48.40.260702

# QNN HTP variant to pre-package into the APK (arm64-v8a only).
#   - In terminal: export QNN_VARIANT=v81
#   - In Android Studio: uncomment and edit below
# If left unset, NO QNN DSP libraries are pre-packaged and built-in
# QNN voice will be unavailable at runtime.
# Valid values match the hexagon-v* folders in the QNN SDK:
#   v68, v69 (SM8350/SM8450), v73 (SM8550), v75 (SM8650),
#   v79 (SM8750), v81 (SM8850)
qnnVariant=v81
