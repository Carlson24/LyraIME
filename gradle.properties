# https://developer.android.com/build/optimize-your-build#disable-the-jetifier-flag
android.enableJetifier=false
android.useAndroidX=true

# enlarge heap size to 4GB
org.gradle.jvmargs=-Xmx4096M -XX:+HeapDumpOnOutOfMemoryError

# Only package arm64-v8a (Android ABI: arm64-v8a)
buildABI=arm64-v8a

# Select QNN DSP flavor for local development (v68/v69/v73/v75/v79/v81)
# Set to empty to build the default (no DSP-specific libs)
# In Android Studio, use Build Variants panel or set here:
buildQnnFlavor=v81

# Qualcomm QNN SDK path:
#   - In terminal: export QNN_SDK_ROOT=$HOME/.local/share/Android/qairt/2.47.0.260601
#   - In Android Studio: uncomment and edit below
qnnSdkRoot=/home/carlson/.local/share/Android/qairt/2.47.0.260601
