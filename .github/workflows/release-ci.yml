name: Release
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
env:
  CI_NAME: Release CI
  QNN_SDK_VERSION: "2.47.0.260601"
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: 17
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android NDK
        run: |
          sdkmanager --install "cmake;4.1.2"

      - name: Download QNN SDK
        run: |
          mkdir -p ${{ runner.temp }}/qnn
          cd ${{ runner.temp }}/qnn
          curl -fSL -o "v${QNN_SDK_VERSION}.zip" \
            "https://softwarecenter.qualcomm.com/api/download/software/sdks/Qualcomm_AI_Runtime_Community/All/${QNN_SDK_VERSION}/v${QNN_SDK_VERSION}.zip"
          unzip -q "v${QNN_SDK_VERSION}.zip"
          echo "QNN_SDK_ROOT=${{ runner.temp }}/qnn/qairt/${QNN_SDK_VERSION}" >> $GITHUB_ENV

      - name: Calculate JNI cache hash
        id: cache-hash
        run: |
            ./gradlew :app:calculateNativeCacheHash

      - name: Fetch JNI cache
        uses: actions/cache@v5
        id: jni-cache
        with:
          path: "app/prebuilt"
          key: ${{ runner.os }}-trime-jni-release-${{ steps.cache-hash.outputs.native-cache-hash }}

      - name: Setup Keystore
        run: |
          cat << EOF > keystore.properties
          keyBase64=${{ secrets.SIGNING_KEY }}
          storePassword=${{ secrets.KEY_STORE_PASSWORD }}
          keyAlias=${{ secrets.ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Build LyraIME
        run: make release

      - name: Add JNI cache
        if: ${{ !steps.jni-cache.outputs.cache-hit }}
        run: |
          SRC=app/build/intermediates/merged_native_libs/release/mergeReleaseNativeLibs/out/lib
          DST=app/prebuilt
          for abi in arm64-v8a x86_64; do
            mkdir -p "$DST/$abi"
            for lib in librime_jni.so libsherpa-onnx-jni.so libonnxruntime.so \
                       libsherpa-onnx-c-api.so libsherpa-onnx-cxx-api.so; do
              cp -v "$SRC/$abi/$lib" "$DST/$abi/" 2>/dev/null || true
            done
          done

      - name: Rename APK
        run: |
          cd app/build/outputs/apk/release
          for apk in *.apk; do
            [ -f "$apk" ] || continue
            arch=$(echo "$apk" | grep -oE '(arm64-v8a|x86_64)')
            ver=$(echo "$apk" | grep -oP 'v\d+\.\d+\.\d+\.\d+')
            mv "$apk" "LyraIME-${arch}-${ver}.apk"
          done

      - name: Create Stable release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
          artifacts: "app/build/outputs/apk/release/*.apk"
          body: |
            Update Version: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
