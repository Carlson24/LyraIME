name: Release
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
env:
  CI_NAME: Release CI
  QNN_SDK_VERSION: "2.47.0.260601"
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: 17
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android NDK
        run: |
          sdkmanager --install "cmake;4.1.2"

      - name: Download QNN SDK
        run: |
          mkdir -p ${{ runner.temp }}/qnn
          cd ${{ runner.temp }}/qnn
          curl -fSL -o "v${QNN_SDK_VERSION}.zip" \
            "https://softwarecenter.qualcomm.com/api/download/software/sdks/Qualcomm_AI_Runtime_Community/All/${QNN_SDK_VERSION}/v${QNN_SDK_VERSION}.zip"
          unzip -q "v${QNN_SDK_VERSION}.zip"
          echo "QNN_SDK_ROOT=${{ runner.temp }}/qnn/qairt/${QNN_SDK_VERSION}" >> $GITHUB_ENV

      - name: Copy QNN runtime libs
        run: |
          QNN_SDK=${{ runner.temp }}/qnn/qairt/${QNN_SDK_VERSION}
          DST=app/src/main/jniLibs/arm64-v8a
          mkdir -p "$DST"
          cp -v "$QNN_SDK/lib/aarch64-android/libQnnHtp.so" "$DST/"
          cp -v "$QNN_SDK/lib/aarch64-android/libQnnSystem.so" "$DST/"
          for v in 68 69 73 75 79 81; do
            FDST="app/src/v${v}/jniLibs/arm64-v8a"
            mkdir -p "$FDST"
            cp -v "$QNN_SDK/lib/aarch64-android/libQnnHtpV${v}Stub.so" "$FDST/"
            cp -v "$QNN_SDK/lib/hexagon-v${v}/unsigned/libQnnHtpV${v}Skel.so" "$FDST/"
          done

      - name: Calculate JNI cache hash
        id: cache-hash
        run: |
            ./gradlew :app:calculateNativeCacheHash

      - name: Fetch JNI cache
        uses: actions/cache@v5
        id: jni-cache
        with:
          path: "app/prebuilt"
          key: ${{ runner.os }}-trime-jni-release-${{ steps.cache-hash.outputs.native-cache-hash }}

      - name: Setup Keystore
        run: |
          cat << EOF > keystore.properties
          keyBase64=${{ secrets.SIGNING_KEY }}
          storePassword=${{ secrets.KEY_STORE_PASSWORD }}
          keyAlias=${{ secrets.ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Build Trime (all QNN DSP flavors)
        run: make release-all-flavors
        env:
          ORG_GRADLE_PROJECT_buildQnnFlavor: ""

      - name: Add JNI cache
        if: ${{ !steps.jni-cache.outputs.cache-hit }}
        run: cp -R app/build/intermediates/merged_native_libs/release/mergeReleaseNativeLibs/out/lib app/prebuilt

      - name: Rename APK
        run: |
          cd app/build/outputs/apk
          for dir in v*/; do
            flavor=${dir%/}
            for apk in "$flavor"/release/*.apk; do
              [ -f "$apk" ] || continue
              arch=$(echo "$apk" | grep -oE '(arm64-v8a|x86_64)')
              ver=$(echo "$apk" | grep -oP 'v\d+\.\d+\.\d+\.\d+')
              mv "$apk" "LyraIME-${arch}-${flavor}-${ver}.apk"
            done
          done

      - name: Create Stable release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
          artifacts: "app/build/outputs/apk/LyraIME*.apk"
          body: |
            Update Version: ${{ github.ref_name }}

            QNN DSP 版本 — SoC 对照：
            | Flavor | SoC |
            |--------|-----|
            | v81 | SM8850 (Snapdragon 8 Elite) |
            | v79 | SM8750 (Snapdragon 8 Gen 4) |
            | v75 | SM8650 (Snapdragon 8 Gen 3) |
            | v73 | SM8550 (Snapdragon 8 Gen 2) |
            | v69 | SM8450 / SM8475 (Snapdragon 8 Gen 1 / 8+ Gen 1) |
            | v68 | SM8350 (Snapdragon 888) |
          token: ${{ secrets.GITHUB_TOKEN }}
