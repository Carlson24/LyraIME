name: Nightly
on:
  workflow_dispatch:
  schedule:
    - cron: "0 16 * * *" # UTC 16:00 / GMT+8 0:00, daily

env:
  CI_NAME: Nightly CI
  QNN_SDK_VERSION: "2.51.0.260929"
jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: cpu
            label: Cpu
            qnn_variant: ""
          - variant: v68
            label: Qnnv68
            qnn_variant: v68
          - variant: v69
            label: Qnnv69
            qnn_variant: v69
          - variant: v73
            label: Qnnv73
            qnn_variant: v73
          - variant: v75
            label: Qnnv75
            qnn_variant: v75
          - variant: v79
            label: Qnnv79
            qnn_variant: v79
          - variant: v81
            label: Qnnv81
            qnn_variant: v81
    env:
      QNN_VARIANT: ${{ matrix.qnn_variant }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      # gradle.properties commits a developer-local qnnSdkRoot path and a default
      # qnnVariant; remove both for the CPU-only build, otherwise CMake would try
      # to enable QNN with a non-existent SDK.
      - name: Disable QNN (CPU build)
        if: matrix.variant == 'cpu'
        run: |
          sed -i '/^qnnVariant=/d; /^qnnSdkRoot=/d' gradle.properties
          grep -E '^qnn' gradle.properties || echo "QNN disabled for CPU build"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: 17
          cache: "gradle"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android NDK
        run: |
          sdkmanager --install "cmake;4.1.2"

      - name: Compute build version name
        run: |
          echo "BUILD_VERSION_NAME=$(git describe --tags --long --always --exclude=nightly)" >> $GITHUB_ENV

      - name: Cache QNN SDK
        if: matrix.variant != 'cpu'
        id: qnn-sdk-cache
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/qnn
          key: qnn-sdk-${{ env.QNN_SDK_VERSION }}

      - name: Download QNN SDK
        if: matrix.variant != 'cpu' && steps.qnn-sdk-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ${{ runner.temp }}/qnn
          cd ${{ runner.temp }}/qnn
          curl -fSL -o "v${QNN_SDK_VERSION}.zip" \
            "https://softwarecenter.qualcomm.com/api/download/software/sdks/Qualcomm_AI_Runtime_Community/All/${QNN_SDK_VERSION}/v${QNN_SDK_VERSION}.zip"
          unzip -q "v${QNN_SDK_VERSION}.zip"

      - name: Set QNN_SDK_ROOT
        if: matrix.variant != 'cpu'
        run: |
          echo "QNN_SDK_ROOT=${{ runner.temp }}/qnn/qairt/${QNN_SDK_VERSION}" >> $GITHUB_ENV

      - name: Calculate JNI cache hash
        id: cache-hash
        run: |
          ./gradlew :app:calculateNativeCacheHash

      - name: Fetch JNI cache
        uses: actions/cache@v5
        id: jni-cache
        with:
          path: "app/prebuilt"
          key: ${{ runner.os }}-trime-jni-release-${{ matrix.variant }}-${{ steps.cache-hash.outputs.native-cache-hash }}

      - name: Setup Keystore
        run: |
          cat << EOF > keystore.properties
          keyBase64=${{ secrets.SIGNING_KEY }}
          storePassword=${{ secrets.KEY_STORE_PASSWORD }}
          keyAlias=${{ secrets.ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Build LyraIME (${{ matrix.label }})
        run: make release

      - name: Add JNI cache
        if: ${{ !steps.jni-cache.outputs.cache-hit }}
        run: cp -R app/build/intermediates/merged_native_libs/release/mergeReleaseNativeLibs/out/lib app/prebuilt

      - name: Rename APK
        run: |
          for f in app/build/outputs/apk/release/*.apk; do
            mv "$f" "app/build/outputs/apk/release/LyraIME-${{ matrix.label }}-${BUILD_VERSION_NAME}.apk"
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lyraime-nightly-${{ matrix.variant }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    needs: build
    steps:
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          path: apks
          merge-multiple: true

      - name: Create Nightly release
        uses: "marvinpinto/action-automatic-releases@latest"
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          automatic_release_tag: nightly
          prerelease: true
          title: "Nightly Build"
          files: apks/*.apk
